<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SDK Stripe JS -->
  <script src="https://js.stripe.com/v3/"></script>
  <script src="paie.js" defer></script>
  
  <title>Formulaire de Commande & Paiement</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      background-color: #f4f7f6;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 20px; min-height: 100vh; margin: 0;
    }
    .card {
      background: #ffffff; padding: 25px;
      border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%; max-width: 480px;
    }
    h2 { margin-top: 0; color: #333; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    input, select {
      width: 100%; padding: 10px;
      border: 1px solid #ccc; border-radius: 5px; font-size: 14px;
    }
    
    #stripeCardContainer {
      display: none;
      border: 1px solid #007bff;
      padding: 12px;
      border-radius: 5px;
      background-color: #f8f9fa;
      margin-bottom: 15px;
    }
    #card-element {
      background: white;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .error-msg { 
      color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb;
      padding: 10px; border-radius: 5px; font-size: 13px; display: none; margin-top: 10px; 
    }
    .success-msg {
      color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb;
      padding: 12px; border-radius: 5px; font-size: 14px; font-weight: bold;
      text-align: center; display: none; margin-top: 15px;
    }

    .button-group { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    .btn-pay {
      width: 100%; background-color: #007bff; color: white; border: none;
      padding: 12px; font-size: 15px; font-weight: bold; border-radius: 5px; cursor: pointer;
    }
    .btn-pay:hover { background-color: #0056b3; }
    .btn-whatsapp {
      width: 100%; background-color: #25D366; color: white; border: none;
      padding: 12px; font-size: 15px; font-weight: bold; border-radius: 5px; cursor: pointer;
    }
    .btn-whatsapp:hover { background-color: #1ebd56; }

    /* Style Widget Météo Dynamique */
    .meteo-box {
      background-color: #e3f2fd; border: 1px solid #90caf9;
      border-radius: 8px; padding: 15px; margin-bottom: 20px; text-align: center;
      transition: all 0.5s ease;
    }
    .meteo-title { font-weight: bold; font-size: 16px; color: #1565c0; margin-bottom: 5px; }
    .meteo-climat { font-size: 15px; font-weight: bold; margin: 5px 0; }
    .meteo-info { font-size: 14px; color: #333; margin-bottom: 8px; }
    .meteo-update-time { font-size: 11px; color: #666; font-style: italic; }
    .btn-refresh-meteo {
      background: #1565c0; color: white; border: none; padding: 5px 10px;
      font-size: 12px; border-radius: 4px; cursor: pointer; margin-top: 5px;
    }
    .btn-refresh-meteo:hover { background: #0d47a1; }
  </style>
</head>
<body>

  <div class="card">
    
    <!-- Widget Météo Dynamique et Auto-actualisé -->
    <div class="meteo-box" id="meteoCard">
      <div class="meteo-title">🌦️ Météo en Temps Réel (Bujumbura)</div>
      <div class="meteo-climat" id="climatTexte">⏳ Chargement de l'API Météo...</div>
      <div class="meteo-info">
        Température : <strong id="temp">--</strong> °C | Vent : <strong id="vent">--</strong> km/h
      </div>
      <div class="meteo-update-time" id="meteoTime">Dernière mise à jour : --:--:--</div>
      <button type="button" class="btn-refresh-meteo" id="btnRefreshMeteo">🔄 Actualiser la météo</button>
    </div>

    <h2>Formulaire de Commande</h2>
    <form id="orderForm">
      
      <div class="form-group">
        <label for="nom">Nom :</label>
        <input type="text" id="nom" placeholder="Votre nom" required>
      </div>

      <div class="form-group">
        <label for="prenom">Prénom :</label>
        <input type="text" id="prenom" placeholder="Votre prénom" required>
      </div>

      <div class="form-group">
        <label for="pays">Pays :</label>
        <select id="pays" required>
          <option value="">Chargement de tous les pays...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="produit">Sélectionnez le produit :</label>
        <select id="produit" required>
          <option value="T-Shirt">T-Shirt</option>
          <option value="Chaussures Sport">Chaussures Sport</option>
          <option value="Sac à dos">Sac à dos</option>
        </select>
      </div>

      <div class="form-group">
        <label for="quantite">Quantité :</label>
        <input type="number" id="quantite" value="1" min="1" required>
      </div>

      <div class="form-group">
        <label for="devise">Devise de règlement :</label>
        <select id="devise" required>
          <option value="">-- Choisir une devise --</option>
          <option value="BIF">BIF (Franc Burundais)</option>
          <option value="USD">USD (Dollar US)</option>
          <option value="EUR">EUR (Euro)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="paiement">Mode de paiement :</label>
        <select id="paiement" required>
          <option value="">-- Choisir un moyen de paiement --</option>
          <option value="stripe">Stripe (Carte Bancaire)</option>
          <option value="afriregister">Afriregister Payment Gateway</option>
          <option value="LumiCash">LumiCash</option>
          <option value="EcoCash">EcoCash</option>
          <option value="BANCOBU eNOT">BANCOBU eNOT</option>
        </select>
      </div>

      <div id="stripeCardContainer">
        <label>Numéro de carte bancaire Stripe :</label>
        <div id="card-element"></div>
      </div>

      <div id="errorBox" class="error-msg"></div>
      <div id="successBox" class="success-msg"></div>

      <div class="button-group">
        <button type="button" id="btnPayerEnLigne" class="btn-pay">
          💳 Valider et Payer en ligne
        </button>

        <button type="button" id="btnEnvoyerWhatsApp" class="btn-whatsapp">
          📲 Envoyer la commande sur WhatsApp
        </button>
      </div>

    </form>
  </div>

</body>
</html>
